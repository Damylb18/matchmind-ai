services:
  - type: web
    name: matchmind-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: OPENAI_ENABLED
        value: "false"
      - key: EVENT_INTERVAL_MS
        value: "1000"
      - key: HALF_TIME_BREAK_MS
        value: "15000"
      - key: AUTO_RESTART_MS
        value: "15000"
